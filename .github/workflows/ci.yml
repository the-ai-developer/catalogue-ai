name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      # go.mod lives in services/api; running `go build ./...` from the repo
      # root fails with "directory prefix . does not contain main module".
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/api/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy faiss-cpu fastapi pydantic pytest httpx
      - run: python -m compileall -q services/model-server ml scripts
      - run: pytest tests -q
        working-directory: services/model-server
      - run: pytest ml/notebooks/test_nbsetup.py -q
      # The committed .ipynb files are generated artefacts. Regenerating and
      # failing on any diff stops a notebook saved by an editor (Jupyter, VS
      # Code, Colab) from silently drifting from build_notebooks.py — which is
      # how stale cell outputs and hand edits end up committed.
      - name: notebooks must match their generator
        run: |
          python ml/notebooks/build_notebooks.py
          git diff --exit-code -- ml/notebooks/ \
            || { echo "::error::run 'make notebooks' and commit the result"; exit 1; }
      - run: bash -n scripts/e2e_demo.sh

  notebooks:
    # Executes every notebook end to end from a working directory that has no
    # relationship to the repo — the same condition as a Colab kernel, and what
    # catches relative-path imports that work locally and fail remotely.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # torch comes from the PyTorch CPU index; everything else from PyPI.
      # Passing --index-url applies it to every package in the command, so
      # numpy/pillow/matplotlib must be installed separately or they 404.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy pillow matplotlib faiss-cpu
      - run: python ml/data/make_synthetic_dataset.py --n 256
      - run: python ml/notebooks/run_notebooks.py 01 03 --require-deps
      # 02 trains a small seq2seq; it is the slowest, so keep it out of the
      # default path. Enable by dropping the target below.
      # - run: python ml/notebooks/run_notebooks.py 02 --require-deps

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx vitest run
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/Dockerfile.api -t catalogue-api .
      - run: docker build -f deploy/docker/Dockerfile.web -t catalogue-web .
        # model image needs the full ML stack — build only on GPU runners:
        # docker build -f deploy/docker/Dockerfile.model -t catalogue-model .
