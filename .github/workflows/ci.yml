name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/api/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
        working-directory: services/api

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy faiss-cpu fastapi pydantic pytest httpx
      - run: python -m compileall -q services/model-server ml scripts
      - run: pytest tests -q
        working-directory: services/model-server
      - run: pytest ml/notebooks/test_nbsetup.py -q
      - run: python ml/notebooks/build_notebooks.py
      - bash -n scripts/e2e_demo.sh

  notebooks:
    # Executes every notebook end to end from a working directory that has no
    # relationship to the repo — the same condition as a Colab kernel, and what
    # catches relative-path imports that work locally and fail remotely.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pillow matplotlib torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install faiss-cpu
      - run: python ml/data/make_synthetic_dataset.py --n 256
      - run: python ml/notebooks/run_notebooks.py 01 03 --require-deps
      # 02 trains a small seq2seq; it is the slowest, so keep it out of the
      # default path. Enable by dropping the target below.
      # - run: python ml/notebooks/run_notebooks.py 02 --require-deps

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx vitest run
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/Dockerfile.api -t catalogue-api .
      - run: docker build -f deploy/docker/Dockerfile.web -t catalogue-web .
        # model image needs the full ML stack — build only on GPU runners:
        # docker build -f deploy/docker/Dockerfile.model -t catalogue-model .
